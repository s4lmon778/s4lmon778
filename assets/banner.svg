<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">s4lmon — practical software, thoughtful interfaces</title>
  <desc id="desc">A dark green banner with understated geometric tiles.</desc>
  <defs>
