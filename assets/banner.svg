    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a6e3bc" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
